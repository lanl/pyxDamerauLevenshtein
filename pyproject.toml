[build-system]
requires = ["setuptools>=77", "Cython>=3.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pyxDamerauLevenshtein"
version = "1.11.0"
description = "pyxDamerauLevenshtein implements the Damerau-Levenshtein (DL) edit distance algorithm for Python in Cython for high performance."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Geoffrey Fairchild", email = "mail@gfairchild.com" }
]
maintainers = [
    { name = "Geoffrey Fairchild", email = "mail@gfairchild.com" }
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Linguistic",
]

[project.urls]
Homepage = "https://github.com/lanl/pyxDamerauLevenshtein"
Changelog = "https://github.com/lanl/pyxDamerauLevenshtein/blob/master/CHANGES.md"
Issues = "https://github.com/lanl/pyxDamerauLevenshtein/issues"

[dependency-groups]
test = ["pytest>=8"]
lint = ["ruff==0.17.3"]
# building the traced extension in place (see setup.py) needs the build dependencies installed in the environment
coverage = [{ include-group = "test" }, "pytest-cov>=7", "Cython>=3.1", "setuptools>=77"]
dev = [{ include-group = "coverage" }, { include-group = "lint" }]

[tool.setuptools.packages.find]
include = ["pyxdameraulevenshtein*"]

[tool.setuptools.package-data]
pyxdameraulevenshtein = ["*.pyi", "py.typed", "*.pyx"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
# the Cython.Coverage plugin only works with the C tracer, not with sys.monitoring (the default on Python 3.14+)
core = "ctrace"
plugins = ["Cython.Coverage"]
source = ["pyxdameraulevenshtein"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false

[tool.cibuildwheel]
environment = { CFLAGS = "-O3 -g0 -mtune=generic -pipe -fPIC", LDFLAGS = "-fPIC" }
test-groups = ["test"]
test-sources = ["tests", "pyproject.toml"]
test-command = "pytest"

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    "PYI",  # flake8-pyi
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
# the license header is kept as a docstring in every file, including the stub
"*.pyi" = ["PYI021"]

